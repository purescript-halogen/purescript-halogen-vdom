name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"

      - name: Install dependencies
        run: npm install

      - name: Build source
        run: npm run-script build

      - name: Compile test example
        run: npm test
