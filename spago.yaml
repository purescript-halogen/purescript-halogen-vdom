package:
  name: halogen-vdom
  description: An extensible virtual-dom library for PureScript
  dependencies:
    - arrays: ">=7.0.0 <8.0.0"
    - bifunctors: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - foreign: ">=7.0.0 <8.0.0"
    - foreign-object: ">=4.0.0 <5.0.0"
    - functions: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - newtype: ">=5.0.0 <6.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
    - web-dom: ">=6.0.0 <7.0.0"
    - web-events: ">=4.0.0 <5.0.0"
  test:
    main: Test.Main
    dependencies:
      - exists: ">=6.0.0 <7.0.0"
      - foldable-traversable
      - web-html: ">=4.0.0 <5.0.0"
  publish:
    version: 8.0.1
    license: Apache-2.0
    location:
      githubOwner: purescript-halogen
      githubRepo: purescript-halogen-vdom
workspace:
  packageSet:
    registry: 81.4.0
  buildOpts:
    censorLibraryWarnings: all
